<title>Аудит одного текста</title>
<style>
/* «Аудит одного текста» — EBM Through Blind Spots / FLAS.
   Один файл, без внешних зависимостей и без fetch. Палитра курса.
   Серии графиков (#B4573A субъект, #0A97A3 сравнение) провалидированы
   validate_palette.js на креме #F8EACF (light): PASS; WARN контраста teal
   снимается обязательными прямыми подписями. #C08A3E — только аннотации
   с текстовой подписью, #B9A98F — контекст; они не категориальные серии. */
:root {
  color-scheme: light;
  --paper:   #F8EACF;
  --panel:   #FFFDF6;
  --panel-2: #F5E7C8;
  --line:    #D9C9A6;
  --fg:      #2A2622;
  --fg-dim:  #8C8478;
  --petrol:      #0B5359;
  --petrol-l:    #157079;
  --petrol-soft: #DCEAE8;
  --teal-chart:  #0A97A3;
  --verm:        #B4573A;
  --verm-soft:   #F6DED3;
  --ochre:       #C08A3E;
  --ochre-soft:  #F3E4C6;
  --ctx:         #B9A98F;
  --ok:          #2F6B4F;
  --ok-soft:     #DCEBDD;
  --gray-letter: #CFC5AE;
  --ui:   -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, 'DejaVu Sans Mono', monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--fg); font-family: var(--ui); font-size: 15.5px; line-height: 1.55; margin: 0; }
.wrap {
  max-width: 880px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: max(24px, env(safe-area-inset-top, 0px));
  padding-bottom: max(48px, env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--petrol); }
h1 { font-size: clamp(26px, 5.4vw, 40px); font-weight: 800; letter-spacing: -.02em; line-height: 1.1; margin: 6px 0 0; text-wrap: balance; }
h1 .hi { color: var(--verm); }
.lede { margin: 8px 0 0; color: var(--fg-dim); max-width: 72ch; }

.progress { display: flex; gap: 4px; margin-top: 14px; }
.progress .p { flex: 1; height: 7px; border-radius: 4px; background: var(--gray-letter); }
.progress .p.on { background: var(--petrol); }
.progress .p.cur { outline: 2px solid var(--petrol); outline-offset: 1px; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; min-width: 0; }
.card h2 { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--petrol); margin: 0 0 10px; }
.card h3 { margin: 0 0 8px; font-size: 17px; font-weight: 700; letter-spacing: -.01em; }

.tocgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 680px) { .tocgrid { grid-template-columns: 1fr; } }
.modcard { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; cursor: pointer; font: inherit; color: inherit; display: flex; flex-direction: column; gap: 6px; }
.modcard:hover { border-color: var(--petrol); }
.modcard .mnum { font-size: 11.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--petrol); display: flex; justify-content: space-between; }
.modcard .mnum .tick { color: var(--ok); letter-spacing: 0; }
.modcard .mname { font-weight: 700; }
.modcard .mtime { font-size: 13px; color: var(--fg-dim); }

.topbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.ghost { font: 600 13px/1 var(--ui); color: var(--fg-dim); background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 10px 14px; cursor: pointer; }
.ghost:hover { color: var(--petrol); border-color: var(--petrol); }
:is(button, [tabindex], input, summary):focus-visible { outline: 2px solid var(--petrol); outline-offset: 2px; }

.stmt { padding: 14px 16px; border-left: 3px solid var(--ochre); background: var(--panel-2); border-radius: 0 10px 10px 0; margin: 0 0 4px; }
.stmt .where { display: block; font-size: 12.5px; color: var(--fg-dim); margin-top: 6px; }
.stmt .q { font-style: italic; }
.steplab { font-size: 11.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--petrol); margin: 16px 0 8px; }

.act { font: 600 14.5px/1.25 var(--ui); color: #fff; background: var(--petrol); border: 0; border-radius: 9px; padding: 11px 16px; cursor: pointer; }
.act:hover { background: var(--petrol-l); }
.act:disabled { background: var(--gray-letter); cursor: default; }
.act.alt { background: var(--panel); color: var(--petrol); border: 1px solid var(--petrol); }
.act.alt:hover { background: var(--petrol-soft); }
.act.alt:disabled { color: var(--fg-dim); border-color: var(--line); background: var(--panel); }
.act.good:disabled { background: var(--ok); color: #fff; border: 0; }
.act.sel { outline: 3px solid var(--petrol); outline-offset: 1px; }
.btncol { display: flex; flex-direction: column; gap: 10px; align-items: stretch; margin-top: 10px; }
.btncol .act { text-align: left; }
.btnrow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; }

.toast { margin-top: 12px; font-size: 14px; color: var(--verm); min-height: 1.3em; }
.toast.good { color: var(--ok); }
.reveal { margin-top: 14px; padding: 13px 15px; border-radius: 10px; background: var(--ok-soft); font-size: 14.5px; }
.reveal b { color: var(--ok); }
.rule { margin-top: 10px; padding: 12px 15px; border-radius: 10px; background: var(--petrol-soft); color: var(--petrol); font-weight: 600; font-size: 14.5px; }
.formula { font-family: var(--mono); font-size: 13.5px; background: var(--panel-2); border-radius: 8px; padding: 10px 12px; margin-top: 12px; }

.calcf { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; background: var(--panel-2); border-radius: 8px; padding: 9px 11px; margin-top: 10px; }
.calcf label { font-size: 14px; flex: 1 1 180px; }
.calcf input { font: 500 15px/1.2 var(--mono); width: 110px; padding: 8px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--fg); }
.calcf input.ok { border-color: var(--ok); background: var(--ok-soft); }
.calcf input.bad { border-color: var(--verm); background: var(--verm-soft); }

.excerpt { margin-top: 12px; border: 1px dashed var(--petrol); border-radius: 10px; padding: 12px 15px; background: var(--panel); font-size: 14.5px; }
.excerpt .src { display: block; font-size: 12.5px; color: var(--fg-dim); margin-top: 8px; }
.excerpt .en { font-style: italic; }
.excerpt mark { background: var(--ochre-soft); color: var(--fg); padding: 0 3px; border-radius: 3px; font-weight: 700; }

.scene { margin-top: 12px; }
.scene svg { width: 100%; height: auto; display: block; user-select: none; -webkit-user-select: none; }
.srcline { font-size: 12.5px; color: var(--fg-dim); margin: 6px 0 0; }
.hero { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; }
.hero .hb { flex: 1 1 180px; background: var(--panel-2); border-radius: 10px; padding: 10px 14px; }
.hero .hb .hv { font: 700 26px/1.1 var(--ui); font-variant-numeric: tabular-nums; }
.hero .hb .hl { font-size: 13px; color: var(--fg-dim); margin-top: 2px; }
.hero .hb.nodata .hv { font-size: 15px; font-weight: 600; color: var(--fg-dim); }

.lab { font-family: var(--ui); font-size: 11px; fill: var(--fg-dim); font-weight: 600; }
.lab.big { font-size: 13px; fill: var(--fg); font-weight: 700; }
.lab.mono { font-family: var(--mono); font-weight: 600; }
.lab.heroN { font-size: 24px; fill: var(--fg); font-weight: 800; }

.quotecard { display: inline-block; background: var(--panel); border: 1.5px solid var(--verm); color: var(--fg); border-radius: 9px; padding: 8px 12px; margin: 4px 6px 4px 0; cursor: pointer; font: 600 13.5px/1.3 var(--ui); }
.quotecard.sel { background: var(--verm); color: #fff; }
.quotecard.placed { border-style: dashed; opacity: .75; cursor: default; }
.zones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
@media (max-width: 560px) { .zones { grid-template-columns: 1fr; } }
.zone { border: 1.5px dashed var(--line); border-radius: 10px; padding: 10px 12px; min-height: 64px; cursor: pointer; background: var(--panel); }
.zone:hover { border-color: var(--petrol); }
.zone .zl { font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--petrol); margin-bottom: 6px; }
.zone .chiplist { display: flex; flex-wrap: wrap; gap: 6px; }
.zchip { font-size: 12.5px; font-weight: 600; border-radius: 999px; padding: 4px 10px; background: var(--panel-2); }
.zchip.okz { background: var(--ok-soft); color: var(--ok); }
.zchip.badz { background: var(--verm-soft); color: var(--verm); }

.factrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); padding: 10px 0; }
.factrow:first-of-type { border-top: 0; }
.factrow .ft { flex: 1 1 280px; font-size: 14.5px; }
.factrow .fb { display: flex; gap: 6px; }
.fbtn { font: 600 12.5px/1 var(--ui); border: 1px solid var(--line); background: var(--panel); color: var(--fg-dim); border-radius: 999px; padding: 7px 11px; cursor: pointer; }
.fbtn:hover { border-color: var(--petrol); color: var(--petrol); }
.fbtn[aria-pressed="true"] { background: var(--petrol); border-color: var(--petrol); color: #fff; }
.fnote { font-size: 13px; color: var(--fg-dim); margin: 2px 0 0; }

.years { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
.yearchip { font: 600 12px/1 var(--mono); border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 7px; padding: 8px 7px; cursor: pointer; min-width: 44px; text-align: center; }
.yearchip[aria-pressed="true"] { background: var(--verm); border-color: var(--verm); color: #fff; }
.yearchip.hit { outline: 2px solid var(--ok); }
.yearchip.miss { outline: 2px solid var(--verm); outline-style: dashed; }
.yearchip.bnd[aria-pressed="true"] { background: var(--ctx); border-color: var(--ctx); color: var(--fg); }

.claims .factrow .fb { flex-wrap: wrap; }
.scale { position: relative; height: 56px; border-radius: 10px; background: linear-gradient(90deg, var(--petrol-soft), var(--verm-soft)); margin-top: 10px; display: flex; }
.scale .half { flex: 1; display: flex; align-items: flex-end; padding: 6px 10px; font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--fg-dim); cursor: pointer; border-radius: 10px; }
.scale .half:hover { outline: 2px dashed var(--petrol); outline-offset: -4px; }

table.audit { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-top: 10px; }
table.audit th { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--petrol); text-align: left; padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); }
table.audit td { padding: 8px 8px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
table.audit td.v { white-space: nowrap; font-weight: 600; }
td.v.okv { color: var(--ok); } td.v.badv { color: var(--verm); }
@media (max-width: 560px) { table.audit td.v { white-space: normal; } table.audit { font-size: 12.5px; } }

.rulecards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
@media (max-width: 680px) { .rulecards { grid-template-columns: 1fr; } }
.rulecard { background: var(--panel-2); border-radius: 10px; padding: 11px 14px; font-size: 14px; }
.rulecard b { color: var(--petrol); display: block; margin-bottom: 3px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }

details.fine { margin-top: 12px; font-size: 14px; color: var(--fg-dim); border: 1px dashed var(--line); border-radius: 8px; padding: 8px 12px; }
details.fine summary { cursor: pointer; font-weight: 600; color: var(--petrol); }
details.fine p { margin: 8px 0 2px; }
.foot { color: var(--fg-dim); font-size: 12.5px; line-height: 1.7; margin-top: 6px; }
.starq { border: 1px dashed var(--ochre); border-radius: 10px; padding: 11px 14px; margin-top: 14px; }
.starq .sl { font-size: 11.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ochre); margin-bottom: 6px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
.fadebar rect, .level { transition: width .25s ease, height .25s ease, x .25s ease, y .25s ease, opacity .25s ease; }
</style>
</head>

<script>
'use strict';

/* =============== конфиг и данные (единственный источник чисел) =============== */

const CONFIG = { SHOW_LINKS: false, REVEAL_COAUTHOR: false };

const DATA = {

/* =============== словарь вердиктов =============== */

const V = {
  ok:     'подтверждено',
  src:    'расходится с источником',
  denom:  'подмена знаменателя',
  abs:    'доля вместо абсолюта',
  contra: 'внутреннее противоречие',
  strong: 'сильнее данных',
  nope:   'непроверяемо отсюда',
};
const V_ABS_STRONG = 'доля вместо абсолюта + сильнее данных';

/* =============== помощники =============== */

const SVGNS = 'http://www.w3.org/2000/svg';
const SVGTAGS = new Set(['svg','g','path','line','circle','rect','text','polyline','polygon','tspan','defs','pattern','title','marker']);
const $ = s => document.querySelector(s);
function h(tag, attrs = {}, ...kids) {
  const el = SVGTAGS.has(tag) ? document.createElementNS(SVGNS, tag) : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat(9)) {
    if (kid === null || kid === undefined || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return el;
}
const fmt = n => n.toLocaleString('ru-RU');
function parseNum(str) {
  if (str === null || str === undefined) return NaN;
  let s = String(str).trim().replace(/\s+/g, '').replace(',', '.').replace('%', '');
  return s ? parseFloat(s) : NaN;
}
function hatchDefs() {
  return h('defs', {},
    h('pattern', { id: 'hatch', width: 7, height: 7, patternTransform: 'rotate(45)', patternUnits: 'userSpaceOnUse' },
      h('rect', { width: 7, height: 7, fill: 'var(--ctx)', opacity: .45 }),
      h('line', { x1: 0, y1: 0, x2: 0, y2: 7, stroke: '#FFFDF6', 'stroke-width': 3 })));
}
function tip(...lines) { return h('title', {}, lines.join('\n')); }

/* =============== состояние =============== */

let S;
function freshState() {
  return {
    view: 'toc',
    verdicts: {},               // m1..m7 -> ключ словаря (или 'absstrong'); сравнение в отчете
    m2: { forecast: null, denom: 'diag', diag: false, bonus: null },
    m3: { forecast: null, abs: false, overlay: false, mcq: null, mcqMsg: '' },
    m4: { sel: null, placed: {}, formulation: null },
    m5: { sel: null, placed: {}, p2a: null, p2b: null },
    m6: { assign: {}, revealed: false, headline: null },
    m7: { found: null, msg: '' },
    m8: { open: null, verdicts: {} },
    done: { m2: false, m3: false, m4: false, m5: false, m6: false, m7: false, m8: false },
    toast: '',
  };
}
S = freshState();

/* =============== мета модулей =============== */

const MODS = [
  { id: 'm2', n: 'М1', name: 'Процент от кого?', time: '~12 мин',
    anchor: 'в Великобритании подавления «добились у 98%»',
    options: ['ok', 'denom', 'src', 'strong'], correct: 'denom',
    rule: 'Процентный показатель без указания знаменателя интерпретации не подлежит. При оценке доли первым устанавливается, от какой совокупности она исчислена.' },
  { id: 'm3', n: 'М2', name: 'Посчитайте за автора', time: '~10 мин',
    anchor: 'доля ключевых групп упала с 5,8% до 3% — «отсюда и снижение»',
    options: ['ok', 'absstrong', 'src'], correct: 'absstrong',
    rule: 'Снижение доли не свидетельствует о снижении абсолютного числа. До интерпретации доля подлежит пересчету в абсолютные значения по данным самого текста.' },
  { id: 'm4', n: 'М3', name: 'Очная ставка цитат', time: '~10 мин',
    anchor: '«реже умирают» — и «смертность на историческом максимуме»',
    options: ['ok', 'contra', 'src'], correct: 'contra',
    rule: 'Все упоминания одной величины сводятся воедино. Утверждения, верные по отдельности, в совокупности могут образовывать противоречие.' },

const modMeta = id => MODS.find(m => m.id === id);
function verdictLabel(k) { return k === 'absstrong' ? V_ABS_STRONG : V[k]; }

/* =============== общие блоки модуля =============== */

function go(view) { S.view = view; S.toast = ''; render(); window.scrollTo({ top: 0 }); }

function stmtCard(text, quote, where) {
  return h('p', { class: 'stmt' }, text, quote ? [' ', h('span', { class: 'q' }, '«' + quote + '»')] : null,
    h('span', { class: 'where' }, 'Где в тексте: ' + where));
}

function verdictBlock(modId, revealHtml) {
  const meta = modMeta(modId);
  const picked = S.verdicts[modId];
  const kids = [h('div', { class: 'steplab' }, 'Ваш вердикт'),
    h('div', { class: 'btncol' },
      ...meta.options.map(k => h('button', {
        class: 'act' + (picked ? (k === meta.correct ? ' good' : ' alt') : ' alt'),
        type: 'button', disabled: picked ? 'disabled' : null,
        onclick: () => { S.verdicts[modId] = k; S.done[modId] = true; render(); } }, verdictLabel(k))))];
  if (picked) {
    kids.push(h('div', { class: 'reveal', html: (picked === meta.correct ? '<b>Верно: ' : '<b>Верный вердикт: ') + verdictLabel(meta.correct) + '.</b> ' + revealHtml }));
    kids.push(h('div', { class: 'rule' }, 'Заключение: ' + meta.rule));
    kids.push(h('div', { class: 'btnrow' }, h('button', { class: 'act', type: 'button', onclick: () => go('toc') }, 'К оглавлению →')));
  }
  return kids;
}

function moduleShell(modId, ...content) {
  const meta = modMeta(modId);
  return h('section', { class: 'card', id: 'mod-' + modId },
    h('div', { class: 'topbar' },
      h('h2', {}, meta.n + ' · ' + meta.name + ' '),
      h('button', { class: 'ghost', type: 'button', onclick: () => go('toc') }, '← оглавление')),
    ...content);
}

    diag: 100,
    reg: RU.registered / RU.diagnosed * 100,
    artLow: RU.onArtLow / RU.diagnosed * 100,
    artHigh: RU.onArtHigh / RU.diagnosed * 100,
    sup: RU.suppressed / RU.diagnosed * 100,

  const yOf = p => base - p * scale;
  // ось
  svg.append(h('line', { x1: 36, y1: base, x2: 630, y2: base, stroke: 'var(--fg)', 'stroke-width': 1.5 }));
  [0, 50, 100].forEach(p => {

  const ruX = [70, 150, 230, 310], bw = 62;
  const ruBars = [
    [pRU.diag, 'диагноз', fmt(RU.diagnosed)],
    [pRU.reg, 'на учете', fmt(RU.registered)],
    [null, 'на терапии', Math.round(RU.onArtLow / 1000) + '–' + Math.round(RU.onArtHigh / 1000) + ' тыс.'],
    [pRU.sup, 'подавление', '≈' + Math.round(RU.suppressed / 1000) + ' тыс.'],

  ruBars.forEach(([p, lab, abs], i) => {

      svg.append(h('text', { x: x + bw / 2, y: yOf(pRU.artHigh) - 6, class: 'lab mono', 'text-anchor': 'middle' }, Math.round(pRU.artLow) + '–' + Math.round(pRU.artHigh) + '%'));
    } else {
      svg.append(h('rect', { x, y: yOf(p), width: bw, height: p * scale, rx: 4, fill: 'var(--verm)' }, tip(lab + ': ' + abs + ' человек')));
      svg.append(h('text', { x: x + bw / 2, y: yOf(p) - 6, class: 'lab mono', 'text-anchor': 'middle' }, Math.round(p) + '%'));
    }
    svg.append(h('text', { x: x + bw / 2, y: base + 15, class: 'lab', 'text-anchor': 'middle' }, lab));
    svg.append(h('text', { x: x + bw / 2, y: base + 28, class: 'lab', 'text-anchor': 'middle', 'font-size': 9.5 }, abs));
  });
  svg.append(h('text', { x: ruX[0], y: base + 48, class: 'lab big' }, 'Россия'));
  // Англия: 3 публикуемые ступени (от диагностированных)
  const enX = [420, 495, 570];
  const enBars = [
    [100, 'диагноз', 'диагностированы ' + EN.diagnosedPct + '% живущих с ВИЧ'],
    [EN.onArtPctOfDiagnosed, 'на терапии', EN.onArtPctOfDiagnosed + '% диагностированных'],
    [EN.suppressedPctOfDiagnosed, 'подавление', EN.suppressedPctOfOnArt + '% получающих терапию'],

  enBars.forEach(([p, lab, note], i) => {

  });

  svg.append(h('text', { x: 648, y: base + 62, class: 'lab', 'font-size': 9.5, 'text-anchor': 'end' }, 'Англия, не вся Великобритания · UKHSA 2025'));
  // диагональ «как сравнила статья»
  if (st.diag) {

  }
  svg.append(h('text', { x: 36, y: 352, class: 'lab' }, 'Столбцы от нуля. Россия — абсолюты подписями; Англия публикует ступени в процентах.'));
  return svg;
}

const M4_QUOTES = [

];
const M4_ZONES = [
  { id: 'zA', label: '2000-е — ранний период' },
  { id: 'zB', label: '2010-е — рост' },

function drawDeaths() {
  const st = S.m4, D = DATA.deaths;
  const svg = h('svg', { viewBox: '0 0 660 260', role: 'img', 'aria-label': 'Смерти среди людей с ВИЧ: форма ряда 2000–2025' });
  const base = 200, x0 = 60, x1 = 620;
  const lo = D.rangeRecent[0] / 1000, hi = D.rangeRecent[1] / 1000; // 30 и 34
  const yOf = v => base - v * 4.4; // 34 тыс. ≈ 150px
  svg.append(h('text', { x: 40, y: 22, class: 'lab big' }, 'СМЕРТИ СРЕДИ ЛЮДЕЙ С ВИЧ · тыс. в год (форма ряда; полный ряд будет уточнен)'));
  // полоса 30–34
  svg.append(h('rect', { x: x0, y: yOf(hi), width: x1 - x0, height: yOf(lo) - yOf(hi), fill: 'var(--ochre)', opacity: .18 }));
  svg.append(h('text', { x: x1, y: yOf(hi) - 4, class: 'lab mono', 'text-anchor': 'end' }, '34 тыс.'));
  svg.append(h('text', { x: x1, y: yOf(lo) + 12, class: 'lab mono', 'text-anchor': 'end' }, '30 тыс.'));
  svg.append(h('line', { x1: 40, y1: base, x2: 620, y2: base, stroke: 'var(--fg)', 'stroke-width': 1.5 }));
  // качественная кривая: подъем → плато → легкое снижение (эскиз, без выдуманных значений)
  svg.append(h('path', { d: `M ${x0} ${base - 14} C 200 ${base - 20}, 260 ${yOf(20)}, 360 ${yOf(hi - 1)} C 420 ${yOf(hi) + 2} , 470 ${yOf(hi)}, 510 ${yOf(hi)} C 560 ${yOf(hi)}, 585 ${yOf(31)}, ${x1} ${yOf(31)}`,
    fill: 'none', stroke: 'var(--verm)', 'stroke-width': 2.5, 'stroke-dasharray': '7 5' },
    tip('эскиз формы: ' + D.shape)));
  // зоны
  const zx = { zA: [x0, 240], zB: [240, 440], zC: [440, x1] };
  M4_ZONES.forEach(z => {
    const [a, b] = zx[z.id];
    const placedHere = M4_QUOTES.filter(q => st.placed[q.id] === z.id);
    svg.append(h('rect', { x: a, y: 36, width: b - a, height: base - 36, fill: placedHere.length ? 'var(--ok)' : 'var(--petrol)',
      opacity: placedHere.length ? .14 : .05, style: 'cursor:pointer',
      onclick: () => placeQuote4(z.id) }, tip(z.label + (st.sel ? ' — положить цитату сюда' : ''))));
    svg.append(h('text', { x: (a + b) / 2, y: base + 16, class: 'lab', 'text-anchor': 'middle' }, z.label.split(' — ')[0]));
    placedHere.forEach((q, i) => svg.append(h('text', { x: (a + b) / 2, y: 52 + i * 15, class: 'lab', 'text-anchor': 'middle', fill: 'var(--ok)', 'font-weight': 700 }, q.text.slice(0, 28) + '…')));
  });
  svg.append(h('text', { x: 40, y: 252, class: 'lab' }, 'Источник: Роспотребнадзор (конференция, окт. 2026): диапазон последних лет 30–34 тыс. в год. Годы по оси: 2000 → 2025.'));
  return svg;
}

function placeQuote4(zoneId) {
  const st = S.m4;
  if (!st.sel) { S.toast = 'bad:Сначала выберите цитату-карточку под графиком, затем нажмите на участок кривой.'; render(); return; }
  st.placed[st.sel] = zoneId;
  S.toast = zoneId === 'zC' ? 'good:Легла на хвост кривой — последние годы.' : 'bad:Эта фраза — о положении дел сейчас. Участок «' + M4_ZONES.find(z => z.id === zoneId).label + '» ее не поддерживает: попробуйте хвост кривой.';
  if (zoneId !== 'zC') delete st.placed[st.sel];
  st.sel = null;
  render();
}

function renderM4() {
  const st = S.m4;
  const bothPlaced = st.placed.q1 === 'zC' && st.placed.q2 === 'zC';
  const [kind, msg] = S.toast ? S.toast.split(/:(.*)/s) : ['', ''];
  return moduleShell('m4',
    stmtCard('Два утверждения одного текста — со ссылкой на один и тот же материал-источник: люди',
      'реже заболевают ВИЧ и умирают', 'блок 1 · и там же, блок 3: смертность «держится на историческом максимуме».'),
    h('div', { class: 'steplab' }, 'Интерактив · положите каждую цитату на участок кривой, который ее поддерживает'),
    h('div', {}, ...M4_QUOTES.map(q => h('button', {
      class: 'quotecard' + (st.sel === q.id ? ' sel' : '') + (st.placed[q.id] ? ' placed' : ''), type: 'button',
      disabled: st.placed[q.id] ? 'disabled' : null,
      onclick: () => { st.sel = q.id; S.toast = 'good:Теперь нажмите на участок кривой.'; render(); } },
      q.text + ' · ' + q.where))),
    h('div', { class: 'scene' }, drawDeaths()),
    h('p', { class: 'toast' + (kind === 'good' ? ' good' : '') }, msg),
    bothPlaced ? [
      h('p', { class: 'fnote' }, 'Обе цитаты легли на один и тот же участок — хвост кривой подсвечен.'),
      h('div', { class: 'steplab' }, 'Выберите точную формулировку'),
      h('div', { class: 'btncol' },
        ...M4_FORM.map((t, i) => h('button', {
          class: 'act' + (st.formulation !== null ? (i === 2 ? ' good' : ' alt') : ' alt'), type: 'button',
          disabled: st.formulation !== null ? 'disabled' : null,
          onclick: () => { st.formulation = i; render(); } }, t))),
      st.formulation !== null && st.formulation !== 2 ? h('p', { class: 'toast' }, 'Так в источнике: диапазон 30–34 тыс. в год — немного снизилась, но у максимума. Обе половины сразу.') : null,
      st.formulation !== null ? verdictBlock('m4', 'Обе цитаты опираются на один источник, и в нем сказано обе вещи сразу: немного снизилась — и остается у максимума. Разнесенные по разным блокам без связки, они стали противоречием — в статье; источник непротиворечив. Кривая примиряет их за секунду.') : null,
    ] : null);
}

const M6_CATS = [['pro', 'поддерживает'], ['contra', 'противоречит'], ['neu', 'нейтрален']];
const M6_HEADS = [
  '«Всё хуже. Минздрав утверждает обратное»',

function renderM6() {
  const st = S.m6;
  const allSet = M6_FACTS.every(f => st.assign[f.id]);

  M6_FACTS.forEach(f => { if (st.assign[f.id]) counts[st.assign[f.id]]++; });
  return moduleShell('m6',
    stmtCard('Заголовок статьи:', 'всё хуже', 'шапка (+ подзаголовок: «Минздрав утверждает обратное»). Ниже — восемь фактов из самого текста.'),

/* =============== финал =============== */

function reportRows() {
  return MODS.map(m => {
    if (m.id === 'm8') {
      const n = Object.values(S.m8.verdicts).filter(v => v === 'ok').length;
      const tot = Object.keys(S.m8.verdicts).length;
      return { mod: m.n + ' · ' + m.name, claim: m.anchor,
        mine: tot ? V.ok + ' × ' + n + ' из ' + tot : '—',
        right: V.ok + ' × 7', okAll: tot === 7 && n === 7, rule: m.rule };
    }
    const mine = S.verdicts[m.id];
    return { mod: m.n + ' · ' + m.name, claim: m.anchor,
      mine: mine ? verdictLabel(mine) : '—',
      right: verdictLabel(m.correct), okAll: mine === m.correct, rule: m.rule };
  });
}
function reportText() {
  const lines = ['АУДИТ ОДНОГО ТЕКСТА — ОТЧЕТ', ''];
  reportRows().forEach(r => {
    lines.push(r.mod);
    lines.push('  утверждение: ' + r.claim);
    lines.push('  ваш вердикт: ' + r.mine + '  ·  верный: ' + r.right);
    lines.push('  заключение: ' + r.rule);
    lines.push('');
  });
  return lines.join('\n');
}
function copyReport() {
  const text = reportText();
  const done = () => { S.toast = 'good:Отчет скопирован.'; render(); };
  const fallback = () => {
    const ta = h('textarea', { style: 'position:fixed;left:-9999px' }, text);
    document.body.append(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) { /* показываем textarea */ }
    ta.remove(); done();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
  else fallback();
}

        h('span', { class: 'mtime' }, m.anchor))),
      h('button', { class: 'modcard', type: 'button', onclick: () => go('final') },
        h('span', { class: 'mnum' }, h('span', {}, 'Финал'), doneN === MODS.length ? h('span', { class: 'tick' }, 'все модули пройдены') : null),
        h('span', { class: 'mname' }, 'Заключения и таблица аудита'),
        h('span', { class: 'mtime' }, 'таблица аудита собирается из ваших ответов'))),
  ];
}

/* =============== каркас =============== */

const VIEWS = { m2: renderM2, m3: renderM3, m4: renderM4, m5: renderM5, m6: renderM6, m7: renderM7, m8: renderM8 };

function render() {
  const app = $('#app');
  const doneN = MODS.filter(m => S.done[m.id]).length;
  const view = S.view === 'toc' ? renderToc() : S.view === 'final' ? renderFinal() : VIEWS[S.view]();
  app.replaceChildren(
    h('header', {},
      h('div', { class: 'eyebrow' }, 'EBM Through Blind Spots · FLAS'),
      h('h1', {}, 'Аудит одного ', h('span', { class: 'hi' }, 'текста')),
      h('p', { class: 'lede' }, 'Шесть переносимых приемов проверки — на материале одних карточек о ВИЧ в России. Без медицинской подготовки: только числа, знаменатели и формулировки.'),
      h('div', { class: 'progress', role: 'img', 'aria-label': 'Пройдено модулей: ' + doneN + ' из ' + MODS.length },
        ...MODS.map(m => h('div', { class: 'p' + (S.done[m.id] ? ' on' : '') + (S.view === m.id ? ' cur' : '') })))),
    ...(Array.isArray(view) ? view : [view]),
    h('footer', { class: 'foot' },
      'Материал: карточки о ВИЧ в России, одно крупное русскоязычное издание, ноябрь 2026. Все проверки выполнены по первоисточникам (ЮНЭЙДС · UKHSA · ECDC/WHO · материалы конференции «Эпиднадзор за ВИЧ-инфекцией») 16.11.2026. Выдержки встроены; внешних ссылок в тренажере нет.'));
}

window.__S = () => S;
document.addEventListener('keydown', () => {}); // no-op; состояние не сбрасывается
render();
</script>
</body>
</html>

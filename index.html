<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>From Association to Causation</title>
<style>
:root{
  --cream:#F5E7C8; --cream-l:#FBF3E2; --paper:#F8EACF;
  --petrol:#0B5359; --petrol-l:#157079; --verm:#B4573A; --char:#2A2622;
  --ochre:#C08A3E; --grey:#8C8478; --line:#D9C9A6;
  --ok:#2F6B4F;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--char);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 80px}
header{border-bottom:2px solid var(--verm);margin-bottom:0;padding:22px 0 16px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--grey);font-size:14px}
.idbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.idbar input{flex:1 1 180px;min-width:0}
input,textarea,select{
  font:inherit;color:var(--char);background:var(--cream-l);
  border:1px solid var(--line);border-radius:6px;padding:9px 11px;width:100%;
}
textarea{line-height:1.5;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--petrol);outline-offset:-1px;border-color:var(--petrol)}
.layout{display:grid;grid-template-columns:1fr 290px;gap:28px;align-items:start}
@media(max-width:880px){.layout{grid-template-columns:1fr}.side{order:-1;position:static!important}}
.side{position:sticky;top:16px}
nav.steps{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 24px}
nav.steps button{
  font:600 12px/1 inherit;letter-spacing:.02em;padding:9px 11px;border-radius:5px;
  border:1px solid var(--line);background:var(--cream-l);color:var(--grey);cursor:pointer;
}
nav.steps button.on{background:var(--petrol);border-color:var(--petrol);color:var(--cream)}
nav.steps button.done{color:var(--petrol);border-color:var(--petrol)}
nav.steps button:disabled{opacity:.4;cursor:not-allowed}
.panel{display:none}
.panel.on{display:block}
.kicker{font:700 11px/1 inherit;letter-spacing:.14em;text-transform:uppercase;color:var(--verm);margin-bottom:8px}
h2{font-size:22px;margin:0 0 6px}
.lede{color:var(--grey);margin:0 0 20px;max-width:62ch}
.field{margin-bottom:18px}
.field > label{display:block;font-weight:600;margin-bottom:5px}
.field .help{color:var(--grey);font-size:13px;margin-bottom:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:620px){.row2{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:8px;background:var(--cream-l);padding:16px;margin-bottom:16px}
.card.petrol{border-color:var(--petrol)}
.card.verm{border-color:var(--verm)}
.card.ochre{border-color:var(--ochre)}
.card h3{margin:0 0 8px;font-size:15px;letter-spacing:.02em;text-transform:uppercase}
.btn{
  font:600 14px/1 inherit;padding:11px 16px;border-radius:6px;cursor:pointer;
  background:var(--petrol);color:var(--cream);border:1px solid var(--petrol);
}
.btn:hover{background:var(--petrol-l)}
.btn:disabled{background:var(--line);border-color:var(--line);color:#fff;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--petrol)}
.btn.ghost:hover{background:var(--cream)}
.btn.verm{background:var(--verm);border-color:var(--verm)}
.btn.sm{font-size:12px;padding:7px 11px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.hint{
  border-left:3px solid var(--ochre);background:rgba(192,138,62,.09);
  padding:11px 14px;margin:10px 0;font-size:14px;border-radius:0 5px 5px 0;
}
.hint b{color:var(--ochre)}
.flag{
  border-left:3px solid var(--verm);background:rgba(180,87,58,.09);
  padding:11px 14px;margin:10px 0;font-size:14px;border-radius:0 5px 5px 0;
}
.good{border-left-color:var(--ok);background:rgba(47,107,79,.08)}
.locked{opacity:.55;pointer-events:none}
.pill{
  display:inline-block;font:700 10px/1 inherit;letter-spacing:.08em;text-transform:uppercase;
  padding:4px 7px;border-radius:3px;background:var(--line);color:var(--char);
}
.pill.v{background:var(--verm);color:var(--cream)}
.pill.p{background:var(--petrol);color:var(--cream)}
.pill.o{background:var(--ochre);color:var(--cream)}
.side .card{font-size:13px}
.side h3{font-size:11px;letter-spacing:.12em;color:var(--grey)}
.rival{padding:8px 0;border-bottom:1px solid var(--line)}
.rival:last-child{border-bottom:0}
.rival b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--verm)}
.chk{display:flex;gap:9px;align-items:flex-start;margin-bottom:10px}
.chk input{width:18px;height:18px;margin:2px 0 0;flex:0 0 auto}
.chk label{font-weight:600}
.radios{display:flex;flex-direction:column;gap:8px}
.radios label{display:flex;gap:9px;align-items:flex-start;font-weight:400}
.radios input{width:17px;height:17px;margin:2px 0 0;flex:0 0 auto}
table.g{width:100%;border-collapse:collapse;font-size:14px}
table.g th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--grey);padding:0 8px 8px 0;font-weight:700}
table.g td{padding:7px 8px 7px 0;vertical-align:top;border-top:1px solid var(--line)}
.gnum{font-weight:700;color:var(--petrol);width:24px}
.gname{font-weight:600;width:190px}
.verdict-sel{max-width:160px}
details.row{border:1px solid var(--line);border-radius:7px;margin-bottom:10px;background:var(--cream-l)}
details.row[open]{border-color:var(--petrol)}
details.row > summary{
  padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:center;font-weight:600;
  list-style:none;
}
details.row > summary::-webkit-details-marker{display:none}
details.row > summary .n{color:var(--petrol);font-weight:700}
details.row > summary .st{margin-left:auto;display:flex;gap:6px;align-items:center}
.rowbody{padding:0 14px 16px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.tally{display:flex;gap:14px;flex-wrap:wrap;margin:14px 0}
.tallybox{flex:1 1 150px;border:1px solid var(--line);border-radius:7px;padding:12px;background:var(--cream-l);text-align:center}
.tallybox .big{font-size:30px;font-weight:700;line-height:1.1}
.tallybox .lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--grey);margin-top:3px}
.attack{border:1px solid var(--verm);border-radius:7px;padding:14px;margin-bottom:12px;background:rgba(180,87,58,.05)}
.attack .q{font-weight:600;margin-bottom:10px}
.attack .triage{display:flex;gap:8px;flex-wrap:wrap}
.attack .triage button{
  font:600 12px/1 inherit;padding:8px 10px;border-radius:5px;border:1px solid var(--line);
  background:var(--cream-l);cursor:pointer;color:var(--char)
}
.attack .triage button.sel{background:var(--verm);border-color:var(--verm);color:var(--cream)}
.calc{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
@media(max-width:620px){.calc{grid-template-columns:1fr}}
pre.out{
  white-space:pre-wrap;word-break:break-word;background:var(--cream-l);
  border:1px solid var(--line);border-radius:7px;padding:14px;font-size:12.5px;max-height:400px;overflow:auto
}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);color:var(--grey);font-size:12px}
.foot a{color:var(--petrol)}

.langbar{position:absolute;top:18px;right:16px;display:flex;gap:4px}
.langbar button{font:700 11px/1 inherit;letter-spacing:.06em;padding:7px 10px;border-radius:5px;
  border:1px solid var(--line);background:var(--cream-l);color:var(--grey);cursor:pointer}
.langbar button.on{background:var(--petrol);border-color:var(--petrol);color:var(--cream)}
header{position:relative}
details.gloss{margin:0 0 14px;border-left:3px solid var(--petrol);background:rgba(11,83,89,.055);border-radius:0 5px 5px 0}
details.gloss>summary{padding:9px 13px;cursor:pointer;font:600 13px/1.3 inherit;color:var(--petrol);list-style:none}
details.gloss>summary::-webkit-details-marker{display:none}
details.gloss>summary::before{content:"? ";font-weight:700}
details.gloss .gb{padding:0 13px 12px;font-size:13.5px}
details.gloss .gb p{margin:0 0 8px}
details.gloss .gb b{color:var(--petrol)}
details.tool{border:1px solid var(--line);border-radius:7px;background:var(--cream-l);margin-top:18px}
details.tool>summary{padding:12px 14px;cursor:pointer;font-weight:600;list-style:none}
details.tool>summary::-webkit-details-marker{display:none}
details.tool>summary::before{content:"+ ";color:var(--petrol);font-weight:700}
details.tool[open]>summary::before{content:"\2212 ";}
.tb{padding:0 14px 16px}

.paper-pane{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:7px;
  background:#FFF8E9;padding:14px;font-size:13.5px;line-height:1.65;white-space:pre-wrap;
  word-break:break-word;user-select:text}
.paper-pane mark{background:rgba(192,138,62,.35);border-radius:2px}
.paper-pane mark.s-limits{background:rgba(180,87,58,.3)}
.tagbar{position:sticky;bottom:0;display:flex;gap:7px;flex-wrap:wrap;padding:11px 0;
  background:var(--paper);border-bottom:1px solid var(--line);margin-bottom:14px;z-index:5}
.tagbar button{font:600 12px/1 inherit;padding:9px 11px;border-radius:5px;border:1px solid var(--petrol);
  background:var(--cream-l);color:var(--petrol);cursor:pointer}
.tagbar button:hover{background:var(--petrol);color:var(--cream)}
.slot{border:1px solid var(--line);border-radius:7px;padding:11px 13px;margin-bottom:9px;background:var(--cream-l)}
.slot.empty{border-style:dashed;opacity:.75}
.slot .sh{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;margin-bottom:5px}
.slot .sh .x{margin-left:auto;font:600 11px/1 inherit;color:var(--verm);cursor:pointer;background:none;border:0}
.slot .sv{font-size:12.5px;color:var(--char);max-height:90px;overflow:auto}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="langbar"><button id="lEN" class="on">EN</button><button id="lRU">РУС</button></div>
  <h1 data-t="h1"></h1>
  <div class="sub" data-t="sub"></div>
  <div class="idbar">
    <input id="meName" data-ph="phName">
    <input id="mePaper" data-ph="phPaper">
  </div>
</header>

<nav class="steps" id="nav"></nav>

<div class="layout">
<main>

<section class="panel" data-step="0">
  <div class="kicker" data-t="k0"></div>
  <h2 data-t="h0"></h2>
  <p class="lede" data-t="d0"></p>

  <div id="tagZone">
    <h3 style="font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--grey)" data-t="tagT"></h3>
    <p class="sub" data-t="tagH"></p>
    <div id="paperPane" class="paper-pane"></div>
    <div class="tagbar" id="tagbar"></div>
    <div id="slots"></div>
    <div id="flag-load"></div>
  </div>

  <details class="tool" id="loadBox">
    <summary data-t="loadOpt"></summary>
    <div class="tb">
      <p class="sub" data-t="loadWhy"></p>
      <div id="caseBox"></div>
      <div class="sub" style="margin:16px 0 7px" data-t="orOwn"></div>
      <div class="actions" style="border:0;margin:0;padding:0">
        <label class="btn ghost" style="display:inline-block"><span data-t="loadPdf"></span><input type="file" id="pdfIn" accept="application/pdf" hidden></label>
        <button class="btn ghost" id="pasteToggle" data-t="loadPaste"></button>
      </div>
      <div id="pdfStatus" class="sub" style="margin-top:8px"></div>
      <div id="pasteBox" hidden style="margin-top:12px">
        <div class="help" data-t="pasteH"></div>
        <textarea id="rawPaste" rows="6"></textarea>
        <button class="btn sm" id="pasteGo" style="margin-top:8px" data-t="pasteGo"></button>
      </div>
    </div>
  </details>

  <div class="actions"><button class="btn" data-go="1" data-t="next1"></button></div>
</section>

<section class="panel" data-step="1">
  <div class="kicker" data-t="k1"></div>
  <h2 data-t="h1a"></h2>
  <p class="lede" data-t="d1"></p>
  <div class="row2">
    <div class="field"><label data-t="fX"></label><input data-k="xWhat"></div>
    <div class="field"><label data-t="fY"></label><input data-k="yWhat"></div>
  </div>
  <div class="row2">
    <div class="field"><label data-t="fXm"></label><textarea rows="3" data-k="xMeas"></textarea></div>
    <div class="field"><label data-t="fYm"></label><textarea rows="3" data-k="yMeas"></textarea></div>
  </div>
  <div class="card ochre">
    <h3 data-t="periods"></h3>
    <div class="row2">
      <div class="field" style="margin:0"><label data-t="pClaim"></label>
        <div class="calc" style="grid-template-columns:1fr 1fr">
          <input type="number" data-k="claimFrom" data-ph="phFrom"><input type="number" data-k="claimTo" data-ph="phTo"></div></div>
      <div class="field" style="margin:0"><label data-t="pData"></label>
        <div class="calc" style="grid-template-columns:1fr 1fr">
          <input type="number" data-k="dataFrom" data-ph="phFrom"><input type="number" data-k="dataTo" data-ph="phTo"></div></div>
    </div>
    <div id="flag-period"></div>
  </div>
  <div class="field"><label data-t="popQ"></label><div class="help" data-t="popH"></div>
    <div class="radios">
      <label><input type="radio" name="samepop" value="same" data-k="samePop"> <span data-t="pop1"></span></label>
      <label><input type="radio" name="samepop" value="diff" data-k="samePop"> <span data-t="pop2"></span></label>
      <label><input type="radio" name="samepop" value="places" data-k="samePop"> <span data-t="pop3"></span></label>
    </div><div id="flag-pop"></div></div>
  <div class="actions"><button class="btn ghost" data-go="0" data-t="back"></button><button class="btn" data-go="2" data-t="next2"></button></div>
</section>

<section class="panel" data-step="2">
  <div class="kicker" data-t="k2"></div>
  <h2 data-t="h2a"></h2>
  <p class="lede" data-t="d2"></p>
  <div class="field"><label data-t="qa"></label><input data-k="qA"></div>
  <div class="field"><label data-t="qb"></label><input data-k="qB"></div>
  <div class="field"><label data-t="qc"></label><input data-k="qC"></div>
  <div class="field"><label data-t="pickQ"></label>
    <div class="radios">
      <label><input type="radio" name="pick" value="A" data-k="pick"> <span id="lab-A"></span></label>
      <label><input type="radio" name="pick" value="B" data-k="pick"> <span id="lab-B"></span></label>
      <label><input type="radio" name="pick" value="C" data-k="pick"> <span id="lab-C"></span></label>
      <label><input type="radio" name="pick" value="one" data-k="pick"> <span data-t="pickOne"></span></label>
    </div></div>
  <button class="btn ghost sm" data-hint="split" data-t="hintBtn"></button>
  <div class="hint" id="hint-split" hidden data-t="hintSplit"></div>
  <div class="actions"><button class="btn ghost" data-go="1" data-t="back"></button><button class="btn" data-go="3" data-t="next3"></button></div>
</section>

<section class="panel" data-step="3">
  <div class="kicker" data-t="k3"></div>
  <h2 data-t="h3a"></h2>
  <p class="lede" data-t="d3"></p>
  <div class="field"><label data-t="orderQ"></label>
    <div class="radios">
      <label><input type="radio" name="order" value="cross" data-k="order"> <span data-t="o1"></span></label>
      <label><input type="radio" name="order" value="xfirst" data-k="order"> <span data-t="o2"></span></label>
      <label><input type="radio" name="order" value="yfirst" data-k="order"> <span data-t="o3"></span></label>
      <label><input type="radio" name="order" value="cant" data-k="order"> <span data-t="o4"></span></label>
    </div></div>
  <div class="field"><label data-t="oQuote"></label><textarea rows="3" data-k="orderQuote"></textarea><div id="chk-orderquote"></div></div>
  <div id="flag-order"></div>
  <div class="field" id="targetbox" hidden><label data-t="tgQ"></label><div class="help" data-t="tgH"></div>
    <textarea rows="3" data-k="targetAns"></textarea></div>
  <div class="actions"><button class="btn ghost" data-go="2" data-t="back"></button><button class="btn" data-go="4" data-t="next4"></button></div>
</section>

<section class="panel" data-step="4">
  <div class="kicker" data-t="k4"></div>
  <h2 data-t="h4a"></h2>
  <p class="lede" data-t="d4"></p>
  <div id="rivalwrap"></div>
  <div class="actions"><button class="btn ghost" data-go="3" data-t="back"></button><button class="btn verm" id="lockBtn" data-t="lock"></button></div>
  <p class="sub" style="margin-top:10px" data-t="lockNote"></p>
</section>

<section class="panel" data-step="5">
  <div class="kicker" data-t="k5"></div>
  <h2 data-t="h5a"></h2>
  <p class="lede" data-t="d5"></p>
  <div class="card ochre" data-t="hillCard"></div>
  <div id="rows"></div>
  <div class="actions"><button class="btn ghost" data-go="4" data-t="back"></button><button class="btn" data-go="6" data-t="next6"></button></div>
</section>

<section class="panel" data-step="6">
  <div class="kicker" data-t="k6"></div>
  <h2 data-t="h6a"></h2>
  <p class="lede" data-t="d6"></p>
  <div id="morgan"></div>
  <div class="tally" id="tally"></div>
  <div id="attacks"></div>
  <div class="actions"><button class="btn ghost" data-go="5" data-t="back"></button><button class="btn" data-go="7" data-t="next7"></button></div>
</section>

<section class="panel" data-step="7">
  <div class="kicker" data-t="k7"></div>
  <h2 data-t="h7a"></h2>
  <p class="lede" data-t="d7"></p>
  <div class="field"><label data-t="vQ"></label>
    <div class="radios">
      <label><input type="radio" name="verdict" value="causal" data-k="verdict"> <span data-t="v1"></span></label>
      <label><input type="radio" name="verdict" value="notcausal" data-k="verdict"> <span data-t="v2"></span></label>
      <label><input type="radio" name="verdict" value="undecided" data-k="verdict"> <span data-t="v3"></span></label>
    </div></div>
  <div id="vSummary"></div>
  <div class="field"><label data-t="vWhy"></label><div class="help" data-t="vWhyH"></div>
    <textarea rows="4" data-k="vBecause"></textarea></div>
  <div class="field"><label data-t="vChg"></label><div class="help" data-t="vChgH"></div>
    <textarea rows="3" data-k="vChange"></textarea></div>
  <div class="card" data-t="voiceCard"></div>
  <details class="tool"><summary data-t="calcT"></summary><div class="tb">
    <p class="sub" style="margin-top:0" data-t="calcH"></p>
    <div class="calc">
      <div><label class="sub">a</label><input id="calcA" type="number" step="any"></div>
      <div><label class="sub">b</label><input id="calcB" type="number" step="any"></div>
      <div><button class="btn sm" id="calcGo">a ÷ b</button></div></div>
    <div id="calcOut"></div>
    <div class="calc" style="margin-top:14px">
      <div><label class="sub" data-t="medL"></label><input id="medPct" type="number" step="any"></div><div></div>
      <div><button class="btn sm" id="medGo" data-t="medBtn"></button></div></div>
    <div id="medOut"></div>
  </div></details>
  <div class="actions"><button class="btn ghost" data-go="6" data-t="back"></button><button class="btn" data-go="8" data-t="next8"></button></div>
</section>

<section class="panel" data-step="8">
  <div class="kicker" data-t="k8"></div>
  <h2 data-t="h8a"></h2>
  <div id="completeness"></div>
  <div class="actions" style="border:0;padding-top:0;margin-top:14px">
    <button class="btn" id="btnCopy" data-t="btnCopy"></button>
    <button class="btn ghost" id="btnDl" data-t="btnDl"></button>
    <button class="btn ghost" id="btnSave" data-t="btnSave"></button>
    <label class="btn ghost" style="display:inline-block"><span data-t="btnLoad"></span><input type="file" id="fileIn" accept=".json" hidden></label>
  </div>
  <p class="sub" data-t="handinNote"></p>
  <pre class="out" id="out"></pre>
</section>

</main>
<aside class="side">
  <div class="card verm" id="sideRivals"><h3 data-t="sRivals"></h3><div id="sideRivalList" class="sub"></div></div>
  <div class="card" id="sideFlags"><h3 data-t="sFlags"></h3><div id="sideFlagList" class="sub"></div></div>
  <div class="card"><h3 data-t="sProg"></h3><div id="sideProg" class="sub"></div>
    <button class="btn ghost sm" id="btnSave2" style="margin-top:10px" data-t="btnSave"></button></div>
</aside>
</div>
<div class="foot"><span data-t="foot"></span><span id="setupNote"></span></div>
</div>
<script>
/* ===================================================================
   TEACHER SETUP — edit this one line.
   Paste the URL of your Google Form. Empty = the hand-in button only
   copies and downloads.
=================================================================== */
const FORM_URL = "";
/* =================================================================== */

let L='en';

  r:['Strong when the gradient is something your rival would not produce. If your rival predicts the same gradient - for example because whoever delivered the exposure went back most often where the outcome was already common - the gradient discriminates nothing.','Силён, когда градиент - это то, чего соперник не даёт. Если соперник предсказывает тот же градиент (например, тот, кто доставлял воздействие, чаще возвращался туда, где исход и так был част) - градиент не различает ничего.']},
 {i:4,n:['Replication of the findings','Воспроизводимость'],
  q:['Found again - other people, other researchers, other designs?','Нашли снова - у других людей, другими исследователями, другими дизайнами?'],
  r:['Repeating a design repeats its bias. Dozens of studies agreeing is evidence only if they could have failed in different ways. Ask what was different between them, not how many there were.','Повторение дизайна повторяет его ошибку. Десятки совпадающих исследований - доказательство только если они могли провалиться по-разному. Спрашивайте, чем они отличались, а не сколько их.']},
 {i:5,n:['Biologic plausibility','Правдоподобие механизма'],
  q:['Is there a mechanism that makes sense?','Есть ли механизм, который имеет смысл?'],
  r:['This row rules out nothing. A mechanism makes a story easier to believe, not more likely to be true. Snow had no mechanism and was right; hormone therapy had a beautiful one and was wrong. If you cannot name a rival your mechanism excludes, the row is decoration.','Эта строка не исключает ничего. Механизм делает историю легче для веры, а не вероятнее для правды. У Сноу механизма не было, и он был прав; у ЗГТ был прекрасный, и она была неправа. Если вы не можете назвать соперника, которого исключает ваш механизм, — строка декорация.']},
 {i:6,n:['Consideration of alternate explanations','Альтернативные объяснения'],
  q:['Could chance, bias, a third factor or a backwards arrow produce this with no real effect?','Могут ли случайность, систематическая ошибка, третий фактор или обратная стрелка дать это при отсутствии эффекта?'],
  r:['This is not one of the nine. It is the question the other eight exist to answer. Verdict and evidence must agree here: if the sentence you write admits the deciding rival was not tested, the verdict is not "supports".','Это не один из девяти. Это вопрос, ради ответа на который существуют остальные восемь. Вердикт и доказательство здесь обязаны совпадать: если в вашем предложении признано, что решающий соперник не проверялся, вердикт не «поддерживает».']},
 {i:7,n:['Cessation of exposure','Прекращение воздействия'],
  q:['When the exposure stops, does the outcome fall?','Когда воздействие прекращается, исход падает?'],
  r:['One of the strongest rows: a fixed trait cannot fall when you stop. But it says nothing against a factor that changes at the same time as the exposure. Check whether the exposure actually stopped somewhere, or whether you are reasoning about what would happen.','Одна из сильнейших строк: врождённый признак не может упасть, когда вы прекратили. Но она ничего не говорит против фактора, который меняется одновременно с воздействием. Проверьте, прекращалось ли воздействие где-то на самом деле, или вы рассуждаете о том, что было бы.']},
 {i:8,n:['Consistency with other knowledge','Согласованность с другим знанием'],
  q:['Does it fit trends over time, other countries, other kinds of evidence?','Сходится ли это с трендами во времени, другими странами, другими типами данных?'],
  r:['Where a natural experiment belongs - a change in the exposure caused by something unrelated to the outcome. That is the strongest evidence available outside a trial, and the nine have no row of their own for it. If you have one, say loudly why the rival cannot produce it.','Сюда попадает естественный эксперимент - изменение воздействия, вызванное чем-то посторонним по отношению к исходу. Это сильнейшее доказательство вне испытания, и своей клетки у девяти для него нет. Есть такое - громко скажите, почему соперник этого дать не может.']},
 {i:9,n:['Specificity','Специфичность'],
  q:['One exposure, one outcome?','Одно воздействие - один исход?'],
  r:['An inheritance from the era of one germ, one disease. Smoking has a dozen outcomes and is still a cause. Failing this row is almost never an argument against causation; passing it, as with a rare tumour in a rare age group, can be very strong.','Наследство эпохи «один возбудитель - одна болезнь». У курения десяток исходов, и оно всё равно причина. Провал этой строки почти никогда не аргумент против причинности; а прохождение - как редчайшая опухоль в редчайшем возрасте - бывает очень сильным.']}
];
const STANDARDS=[
 {v:'phrase',n:['Nice phrase','Красивая фраза'],d:['approximate wording is enough','приблизительной формулировки достаточно']},
 {v:'attributed',n:['Attributed','С атрибуцией'],d:['author and work named','названы автор и работа']},
 {v:'exact',n:['Exact','Точно'],d:['verbatim from the source, with context','дословно из источника, с контекстом']},
 {v:'court',n:['Court','Как в суде'],d:['checked against the original edition','сверено с оригинальным изданием']}
];
const STEPS=[['The paper','Статья'],['Claim','Утверждение'],['Split','Расщепление'],['Order','Порядок'],
 ['Rivals','Соперники'],['The nine','Девять'],['Morgan','Морган'],['Decide','Решение'],['Hand in','Сдача']];

const S={paper:'',sec:{},rivals:{},rows:{},morgan:{},answers:{},rivalsLocked:false,step:0,lang:'en'};
SECTIONS.forEach(s=>S.sec[s.k]='');
RIVALS.forEach(r=>S.rivals[r.k]={on:false,text:''});
NINE.forEach(g=>{S.rows[g.i]={verdict:'',evidence:'',source:'',standard:'',beats:{},nothingKind:'',both:''};
                 S.morgan[g.i]={outcome:'',improvement:''};});

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const LI=()=>L==='en'?0:1;
const tx=a=>Array.isArray(a)?a[LI()]:a;
const norm=t=>(t||'').toLowerCase().replace(/[‘’“”]/g,"'")
  .replace(/[‐-―]/g,'-').replace(/\s+/g,' ').trim();
const esc=t=>(t||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let TYPING=false;
const haveSrc=()=>!!norm(S.paper)||!!((S.extra||[]).join('').trim());
const inPaper=t=>{const q=norm(t);if(q.length<15)return false;
  if(norm(S.paper).includes(q))return true;
  return (S.extra||[]).some(x=>norm(x).includes(q));};

/* ---------- language ---------- */
function applyLang(){
  document.documentElement.lang=L;
  $$('[data-t]').forEach(el=>{const v=T[el.dataset.t];if(v)el.innerHTML=v[LI()];});
  $$('[data-ph]').forEach(el=>{const v=T[el.dataset.ph];if(v)el.placeholder=v[LI()];});
  $('#lEN').classList.toggle('on',L==='en');$('#lRU').classList.toggle('on',L==='ru');
  buildNav();buildRivals();buildRows();buildTagbar();buildCaseBox();restore();render();
}

function buildNav(){
  $('#nav').innerHTML=STEPS.map((s,i)=>`<button data-go="${i}">${i}. ${tx(s)}</button>`).join('');
}
function go(n){
  if(n>=5&&!S.rivalsLocked){alert(tx(T.lockFirst));return;}
  S.step=n;
  $$('.panel').forEach(p=>p.classList.toggle('on',+p.dataset.step===n));
  $$('#nav button').forEach((b,i)=>{b.classList.toggle('on',i===n);b.classList.toggle('done',i<n);
    b.disabled=(i>=5&&!S.rivalsLocked);});
  render();window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- paper: load ---------- */
function setPaper(txt){
  S.paper=(txt||'').replace(/\r/g,'').replace(/\n{3,}/g,'\n\n').trim();
  if(!S.paper)return;
  $('#tagZone').hidden=false;
  renderPane();hintsFromPaper();save();
}
$('#pasteToggle').addEventListener('click',()=>{const b=$('#pasteBox');b.hidden=!b.hidden;});
$('#pasteGo').addEventListener('click',()=>{setPaper($('#rawPaste').value);$('#pasteBox').hidden=true;});
$('#pdfIn').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  const st=$('#pdfStatus');st.textContent=tx(T.pdfWait);
  try{
    if(!window.pdfjsLib){
      await new Promise((res,rej)=>{const s=document.createElement('script');
        s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
        s.onload=res;s.onerror=rej;document.head.appendChild(s);});
      pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
    const buf=await f.arrayBuffer();
    const doc=await pdfjsLib.getDocument({data:buf}).promise;
    let out=[];
    for(let p=1;p<=doc.numPages;p++){
      const page=await doc.getPage(p);const c=await page.getTextContent();
      out.push(c.items.map(i=>i.str).join(' '));
    }
    setPaper(out.join('\n\n'));
    st.textContent=tx(T.pdfOk).replace('{n}',doc.numPages);
  }catch(err){
    st.innerHTML=`<span style="color:var(--verm)">${tx(T.pdfFail)}</span>`;
    $('#pasteBox').hidden=false;
  }
});

/* ---------- paper: tagging ---------- */
function buildTagbar(){
  const b=$('#tagbar');if(!b)return;
  b.innerHTML=SECTIONS.map(s=>`<button data-sec="${s.k}">${tx(s.q)}</button>`).join('');
  $$('#tagbar button').forEach(btn=>btn.addEventListener('click',()=>assign(btn.dataset.sec)));
}
function offsetsIn(pane,range){
  let pos=0,st=null,en=null;
  const walk=n=>{
    if(n.nodeType===3){
      if(n===range.startContainer)st=pos+range.startOffset;
      if(n===range.endContainer)en=pos+range.endOffset;
      pos+=n.nodeValue.length;
    } else for(const c of n.childNodes) walk(c);
  };
  walk(pane);
  return (st!==null&&en!==null&&en>st)?[st,en]:null;
}
function assign(k){
  const pane=$('#paperPane'),sel=window.getSelection();
  if(!sel||sel.isCollapsed||!pane.contains(sel.anchorNode)){alert(tx(T.selectFirst));return;}
  const o=offsetsIn(pane,sel.getRangeAt(0));
  if(!o){alert(tx(T.selectFirst));return;}
  const t=S.paper.slice(o[0],o[1]).trim();
  if(t.length<20){alert(tx(T.selectMore));return;}
  S.sec[k]=t;S.ranges=S.ranges||{};S.ranges[k]=o;
  sel.removeAllRanges();renderPane();renderSlots();render();save();
}
function renderPane(){
  const pane=$('#paperPane');if(!pane)return;
  const r=Object.entries(S.ranges||{}).map(([k,v])=>({k,a:v[0],b:v[1]})).sort((x,y)=>x.a-y.a);
  let html='',at=0;
  for(const x of r){
    if(x.a<at)continue;
    html+=esc(S.paper.slice(at,x.a))+`<mark class="s-${x.k}">`+esc(S.paper.slice(x.a,x.b))+'</mark>';
    at=x.b;
  }
  html+=esc(S.paper.slice(at));
  pane.innerHTML=html;
}
function renderSlots(){
  const el=$('#slots');if(!el)return;
  const CQ=S.caseQuotes&&Object.keys(S.caseQuotes).length?S.caseQuotes:null;
  if(CQ){
    const pane=$('#paperPane');if(pane)pane.style.display='none';
    const bar=$('#tagbar');if(bar)bar.style.display='none';
    const th=$('[data-t="tagH"]');if(th)th.textContent=tx(T.caseModeH);
    el.innerHTML=(S.caseFid?`<details class="gloss" open><summary>${tx(T.fidT)}</summary><div class="gb"><p>${esc(S.caseFid[L]||S.caseFid.en)}</p></div></details>`:'')+
     (S.caseProv?`<div class="flag"><b>${tx(T.provT)}</b> ${esc(S.caseProv)}</div>`:'')+
     SECTIONS.map(s=>{const qs=CQ[s.k]||[];
      return `<div class="slot ${qs.length?'':'empty'}">
        <div class="sh">${tx(s.q)}</div>
        ${qs.length?qs.map(q=>{
          const absent=/^(NO |NOTHING)/.test(q.t);
          return `<div style="margin:0 0 11px;padding-left:11px;border-left:3px solid ${absent?'var(--verm)':'var(--petrol)'}">
            <div style="font-size:13.5px">${absent?'<b style="color:var(--verm)">'+esc(q.t)+'</b>':'&laquo;'+esc(q.t)+'&raquo;'}</div>
            <div class="sub" style="font-size:11.5px;margin-top:3px">${esc(q.where)}${q.verified&&q.verified!=='primary'?' · <i>'+esc(q.verified)+'</i>':''}</div>
          </div>`;}).join('')
         :`<div class="sv"><i style="color:var(--grey)">${tx(T.notInPack)}</i></div>`}
      </div>`;}).join('');
    return;
  }
  if(!norm(S.paper)){
    /* No paper text loaded: the student finds the passages in the paper they
       were given and pastes them in. This is the default way through step 0. */
    const pane0=$('#paperPane');if(pane0)pane0.style.display='none';
    const bar0=$('#tagbar');if(bar0)bar0.style.display='none';
    const t0=$('[data-t="tagT"]');if(t0)t0.textContent=tx(T.qT);
    const h0=$('[data-t="tagH"]');if(h0)h0.textContent=tx(T.typeModeH);
    el.innerHTML=SECTIONS.map(s=>`<div class="slot ${(S.sec[s.k]||'').trim()?'':'empty'}">
      <div class="sh">${tx(s.q)}</div>
      <div class="help" style="margin:0 0 7px">${tx(s.h)}</div>
      <textarea rows="3" data-sec="${s.k}" placeholder="${tx(T.secPh)}">${esc(S.sec[s.k]||'')}</textarea>
    </div>`).join('');
    $$('[data-sec]').forEach(t=>{
      const touch=()=>{S.sec[t.dataset.sec]=t.value;
        const sl=t.closest('.slot');if(sl)sl.classList.toggle('empty',!t.value.trim());save();};
      t.addEventListener('input',touch);
      /* On blur refresh the side panel, but never rebuild these boxes:
         re-rendering them mid-edit loses whatever is being typed. */
      t.addEventListener('change',()=>{touch();TYPING=true;render();TYPING=false;});});
    return;
  }
  const pane=$('#paperPane');if(pane)pane.style.display='';
  const bar=$('#tagbar');if(bar)bar.style.display='';
  el.innerHTML=SECTIONS.map(s=>{
    const v=S.sec[s.k];
    return `<div class="slot ${v?'':'empty'}">
      <div class="sh">${tx(s.q)}${v?`<button class="x" data-clr="${s.k}">${tx(T.clear)}</button>`:''}</div>
      <div class="sv">${v?esc(v.slice(0,400))+(v.length>400?'…':''):'<i style="color:var(--grey)">'+tx(s.h)+'</i>'}</div>
    </div>`;}).join('');
  $$('[data-clr]').forEach(b=>b.addEventListener('click',()=>{
    const k=b.dataset.clr;S.sec[k]='';if(S.ranges)delete S.ranges[k];
    renderPane();renderSlots();render();save();}));
}
function hintsFromPaper(){
  const el0=$('#flag-load');
  if(S.caseQuotes&&Object.keys(S.caseQuotes).length){if(el0)el0.innerHTML='';return;}
  const p=norm(S.paper),f=[];
  const probes=[['we cannot','we cannot'],['could not','could not'],['we were unable','we were unable'],
    ['limitation','limitation'],['should not be inferred','should not be inferred'],
    ['cross-sectional','cross-sectional'],['no control group','no control group'],
    ['open-label','open-label'],['was not assessed','was not assessed']];
  probes.forEach(([lab,needle])=>{const c=p.split(needle).length-1;if(c)f.push([lab,c]);});
  const el=$('#flag-load');if(!el)return;
  el.innerHTML = f.length
    ? `<div class="hint"><b>${tx(T.foundPhrases)}</b> ${f.map(x=>`<span class="mono">${x[0]}</span>&nbsp;×${x[1]}`).join(' · ')}<br>${tx(T.foundPhrasesH)}</div>`
    : '';
}

/* ---------- rivals ---------- */
function buildRivals(){
  const w=$('#rivalwrap');if(!w)return;
  w.innerHTML=RIVALS.map(r=>`
   <div class="card">
     <div class="chk"><input type="checkbox" id="rv-${r.k}"><label for="rv-${r.k}">${tx(r.n)}</label></div>
     <div class="help sub" style="margin:0 0 6px 27px">${tx(r.ask)}</div>
     <textarea id="rt-${r.k}" rows="2" style="margin-left:27px;width:calc(100% - 27px)"></textarea>
     <div id="rf-${r.k}" style="margin-left:27px"></div>
   </div>`).join('');
  RIVALS.forEach(r=>{
    $('#rv-'+r.k).addEventListener('change',e=>{S.rivals[r.k].on=e.target.checked;render();save();});
    $('#rt-'+r.k).addEventListener('input',e=>{S.rivals[r.k].text=e.target.value;render();save();});
  });
}
function specific(t){
  t=(t||'').trim();
  if(t.length<25)return false;
  return !/^(confounding|bias|chance|reverse causation|selection|selection bias|random error|конфаундинг|смещение|случайность|обратная причинность)\.?$/i.test(t);
}
function onRivals(){return RIVALS.filter(r=>S.rivals[r.k].on);}

/* ---------- the nine ---------- */
function buildRows(){
  const el=$('#rows');if(!el)return;
  el.innerHTML=NINE.map(g=>`
  <details class="row" id="row-${g.i}">
    <summary><span class="n">${g.i}</span> ${tx(g.n)} <span class="st" id="st-${g.i}"></span></summary>
    <div class="rowbody">
      <details class="gloss"><summary>${tx(T.glossT)}</summary><div class="gb">
        <p><b>${tx(T.glossAsks)}</b> ${tx(g.q)}</p><p>${tx(g.r)}</p></div></details>
      <div class="field"><label>${tx(T.verdictL)}</label>
        <select class="verdict-sel" id="v-${g.i}"><option value="">—</option>
          <option value="supports">${tx(T.supports)}</option>
          <option value="against">${tx(T.against)}</option>
          <option value="nothing">${tx(T.nothing)}</option></select></div>
      <div id="nk-${g.i}"></div>
      <div class="field"><label>${tx(T.stdL)}</label>
        <select id="sd-${g.i}"><option value="">—</option>
        ${STANDARDS.map(s=>`<option value="${s.v}">${tx(s.n)} — ${tx(s.d)}</option>`).join('')}</select></div>
      <div class="field"><label>${tx(T.evL)}</label><textarea id="e-${g.i}" rows="3"></textarea>
        <div id="qc-${g.i}"></div></div>
      <div class="field"><label>${tx(T.srcL)}</label><input id="s-${g.i}"></div>
      <div class="field" id="b-${g.i}"></div>
      <div id="cx-${g.i}"></div>
    </div>
  </details>`).join('');
  NINE.forEach(g=>{
    $('#v-'+g.i).addEventListener('change',e=>{S.rows[g.i].verdict=e.target.value;renderRow(g.i);render();save();});
    $('#sd-'+g.i).addEventListener('change',e=>{S.rows[g.i].standard=e.target.value;renderRow(g.i);save();});
    $('#e-'+g.i).addEventListener('input',e=>{S.rows[g.i].evidence=e.target.value;renderRow(g.i);save();});
    $('#s-'+g.i).addEventListener('input',e=>{S.rows[g.i].source=e.target.value;save();});
  });
}
function renderRow(i){
  const r=S.rows[i];
  const st=$('#st-'+i);if(!st)return;
  st.innerHTML = r.verdict==='supports'?`<span class="pill p">${tx(T.supports)}</span>`
    : r.verdict==='against'?`<span class="pill v">${tx(T.against)}</span>`
    : r.verdict==='nothing'?`<span class="pill">${tx(T.nothing)}</span>`:'';

  const nk=$('#nk-'+i);
  if(r.verdict==='nothing'){
    nk.innerHTML=`<div class="card ochre"><h3>${tx(T.nkT)}</h3><div class="radios">
      ${[['notloaded',T.nk1],['other',T.nk2],['design',T.nk3]].map(([v,txt])=>
        `<label><input type="radio" name="nk${i}" value="${v}" ${r.nothingKind===v?'checked':''}> <span>${tx(txt)}</span></label>`).join('')}
      </div><p class="sub" style="margin-bottom:0">${tx(T.nkFoot)}</p></div>`;
    $$('input[name=nk'+i+']').forEach(el=>el.addEventListener('change',e=>{
      S.rows[i].nothingKind=e.target.value;save();render();}));
  } else nk.innerHTML='';

  const qc=$('#qc-'+i),sd=r.standard,ev=r.evidence||'';
  if(!sd||!ev.trim())qc.innerHTML='';
  else if(sd==='exact'||sd==='court'){
    if(!haveSrc()){
      qc.innerHTML=`<div class="hint"><b>${tx(T.noSrc)}</b></div>`;
    } else if(inPaper(ev)){
      const src=r.fromSource;
      qc.innerHTML=`<div class="hint good"><b>${tx(T.found)}</b> ${src?tx(T.foundSrc):tx(T.foundH)}</div>`;
    } else {
      qc.innerHTML=`<div class="flag"><b>${tx(T.notFound)}</b> ${tx(T.notFoundH)}
        <div class="chk" style="margin:10px 0 0"><input type="checkbox" id="src-${i}">
        <label for="src-${i}" style="font-weight:600">${tx(T.fromSource)}</label></div>
        <div class="sub" style="margin-left:27px">${tx(T.fromSourceH)}</div></div>`;
      const cb=$('#src-'+i);
      if(cb)cb.addEventListener('change',e=>{
        if(e.target.checked){S.extra=S.extra||[];S.extra.push(r.evidence);S.rows[i].fromSource=true;}
        renderRow(i);render();save();});
    }
  }
  else if(sd==='phrase')
    qc.innerHTML=`<div class="hint"><b>${tx(T.noted)}</b> ${tx(T.phraseH)}</div>`;
  else qc.innerHTML='';

  const bx=$('#b-'+i),on=onRivals();
  if(r.verdict==='supports'||r.verdict==='against'){
    bx.innerHTML=`<label>${tx(T.beatsL)}</label><div class="help">${tx(T.beatsH)}</div>`+
      on.map(x=>`<div class="chk"><input type="checkbox" id="bk-${i}-${x.k}" ${r.beats[x.k]?'checked':''}>
        <label for="bk-${i}-${x.k}" style="font-weight:400">${tx(T.yesIt)} <b>${tx(x.n)}</b> ${tx(T.wouldGive)}</label></div>`).join('');
    on.forEach(x=>$('#bk-'+i+'-'+x.k).addEventListener('change',e=>{
      S.rows[i].beats[x.k]=e.target.checked;renderRow(i);render();save();}));
  } else bx.innerHTML='';

  const cx=$('#cx-'+i),bad=on.filter(x=>r.beats[x.k]);
  if(r.verdict==='supports'&&bad.length){
    cx.innerHTML=`<div class="flag"><b>${tx(T.cxT)}</b> ${tx(T.cxA)} <b>${bad.map(x=>tx(x.n)).join(', ')}</b> ${tx(T.cxB)}
      <div style="margin-top:9px"><textarea id="both-${i}" rows="2" placeholder="${tx(T.cxPh)}">${esc(r.both)}</textarea></div></div>`;
    $('#both-'+i).addEventListener('input',e=>{S.rows[i].both=e.target.value;save();render();});
  } else { cx.innerHTML=''; }
}

/* ---------- Morgan ---------- */
function renderMorgan(){
  const on=onRivals(),sup=NINE.filter(g=>S.rows[g.i].verdict==='supports');
  const m=$('#morgan');if(!m)return;
  if(!sup.length){m.innerHTML=`<div class="card">${tx(T.morganEmpty)}</div>`;$('#tally').innerHTML='';return;}
  m.innerHTML=sup.map(g=>{
    const r=S.rows[g.i],mm=S.morgan[g.i],beaten=on.filter(x=>r.beats[x.k]);
    return `<div class="card ${beaten.length?'verm':'petrol'}">
      <h3>${tx(T.rowW)} ${g.i} · ${tx(g.n)}</h3>
      <p class="sub" style="margin-top:0"><b>${tx(T.nullH)}</b> ${beaten.length?beaten.map(x=>tx(x.n)).join(' · '):tx(T.noneOfYours)}</p>
      <div class="field" style="margin-bottom:10px"><label>${tx(T.outcomeL)}</label><div class="radios">
        ${[['beats',T.mo1],['ties',T.mo2],['worse',T.mo3]].map(([v,txt])=>
          `<label><input type="radio" name="mo${g.i}" value="${v}" ${mm.outcome===v?'checked':''}> <span>${tx(txt)}</span></label>`).join('')}
      </div></div>
      <div class="field" style="margin-bottom:0"><label>${tx(T.impL)}</label>
        <div class="help">${tx(T.impH)}</div>
        <textarea id="mi-${g.i}" rows="2">${esc(mm.improvement)}</textarea></div></div>`;}).join('');
  sup.forEach(g=>{
    $$('input[name=mo'+g.i+']').forEach(el=>el.addEventListener('change',e=>{
      S.morgan[g.i].outcome=e.target.value;render();save();}));
    $('#mi-'+g.i).addEventListener('input',e=>{S.morgan[g.i].improvement=e.target.value;save();});
  });
  const beats=sup.filter(g=>S.morgan[g.i].outcome==='beats').length;
  const dec=sup.filter(g=>['ties','worse'].includes(S.morgan[g.i].outcome)).length;
  $('#tally').innerHTML=`
    <div class="tallybox"><div class="big">${sup.length}</div><div class="lbl">${tx(T.tSup)}</div></div>
    <div class="tallybox"><div class="big" style="color:var(--verm)">${dec}</div><div class="lbl">${tx(T.tDec)}</div></div>
    <div class="tallybox"><div class="big" style="color:var(--petrol)">${beats}</div><div class="lbl">${tx(T.tEv)}</div></div>`;
}

/* ---------- objections (no categories) ---------- */
function firstNum(t){const m=(t||'').match(/\d+(?:[.,]\d+)?/);return m?parseFloat(m[0].replace(',','.')):null;}
function objections(){
  const O=[],R=S.rows;
  const add=(id,q)=>O.push({id,q});
  if(R[5].verdict==='supports')add('o5',tx(T.ob5));
  if(R[4].verdict==='supports')add('o4',tx(T.ob4));
  if(R[2].verdict==='supports'){const n=firstNum(R[2].evidence);
    if(n!==null&&n>0.5&&n<1.5)add('o2',tx(T.ob2).replace('{n}',n));}
  if(R[7].verdict==='supports'&&!/(19|20)\d\d/.test(R[7].evidence||''))add('o7',tx(T.ob7));
  if(R[9].verdict==='against')add('o9',tx(T.ob9));
  if(S.samePop==='places'&&S.verdict==='causal')add('op',tx(T.obPlaces));
  if(S.samePop==='diff')add('od',tx(T.obDiff));
  const cf=+S.claimFrom,ct=+S.claimTo,df=+S.dataFrom,dt=+S.dataTo;
  if(cf&&ct&&df&&dt&&(df>ct||dt<cf))
    add('oy',tx(T.obYears).replace('{a}',cf).replace('{b}',ct).replace('{c}',df).replace('{d}',dt));
  else if(cf&&df&&df>cf+3)
    add('oy2',tx(T.obLate).replace('{a}',cf).replace('{c}',df).replace('{k}',df-cf));
  if(!norm(S.sec.limits))add('ol',tx(T.obLimits));
  const sup=NINE.filter(g=>R[g.i].verdict==='supports').length;
  if(sup>=8)add('oa',tx(T.obAll).replace('{n}',sup));
  return O;
}
function renderObjections(){
  const O=objections(),el=$('#attacks');if(!el)return;
  if(!O.length){el.innerHTML=`<div class="card petrol"><h3>${tx(T.noObjT)}</h3>${tx(T.noObjH)}</div>`;return;}
  el.innerHTML=`<h3 style="letter-spacing:.1em;font-size:12px;color:var(--verm);text-transform:uppercase">${tx(T.objT)}</h3>
    <p class="sub">${tx(T.objH)}</p>`+
   O.map(o=>{const a=S.answers[o.id]||{};return `
    <div class="attack"><div class="q">${o.q}</div>
      <div class="triage" data-oid="${o.id}">
        <button data-t2="change" class="${a.pick==='change'?'sel':''}">${tx(T.obChange)}</button>
        <button data-t2="stand" class="${a.pick==='stand'?'sel':''}">${tx(T.obStand)}</button>
      </div>
      <div style="margin-top:10px" ${a.pick?'':'hidden'}>
        <textarea id="oa-${o.id}" rows="2" placeholder="${a.pick==='change'?tx(T.obChangePh):tx(T.obStandPh)}">${esc(a.text||'')}</textarea>
        <div class="sub" style="margin-top:6px"><a href="#" data-mis="${o.id}" style="color:var(--grey)">${tx(T.obMisread)}</a></div>
      </div></div>`;}).join('');
  $$('.triage').forEach(d=>d.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    S.answers[d.dataset.oid]=Object.assign({},S.answers[d.dataset.oid],{pick:b.dataset.t2});
    renderObjections();save();render();}));
  O.forEach(o=>{
    const ta=$('#oa-'+o.id);
    if(ta)ta.addEventListener('input',e=>{S.answers[o.id]=Object.assign({},S.answers[o.id],{text:e.target.value});save();render();});
    const mis=$('[data-mis="'+o.id+'"]');
    if(mis)mis.addEventListener('click',ev=>{ev.preventDefault();
      const why=prompt(tx(T.obMisreadQ));
      if(why&&why.trim()){S.answers[o.id]=Object.assign({},S.answers[o.id],{pick:'misread',text:why});renderObjections();save();render();}});
  });
}

  const f=[],on=onRivals();
  const cf=+S.claimFrom,ct=+S.claimTo,df=+S.dataFrom,dt=+S.dataTo;
  if(cf&&ct&&df&&dt&&(df>ct||dt<cf))f.push(L==='en'?'Claim period and data period do not overlap':'Период утверждения и период данных не пересекаются');
  else if(cf&&df&&df>cf+3)f.push((L==='en'?'Data on X begin ':'Данные о X начинаются на ')+(df-cf)+(L==='en'?' years after the claim does':' лет позже утверждения'));
  if(S.samePop==='diff')f.push(L==='en'?'X and Y measured in different populations':'X и Y измерены в разных популяциях');
  if(S.samePop==='places')f.push(L==='en'?'Evidence is about places, not people':'Доказательство о местах, не о людях');
  if(S.order==='cross')f.push(L==='en'?'Cross-section: the backwards arrow cannot be ruled out here':'Срез: обратную стрелку здесь исключить нельзя');
  if(S.order==='xfirst'&&!(S.targetAns||'').trim())f.push(L==='en'?'You have not said what decided where X went':'Не сказано, что решило, куда пошёл X');
  if(!norm(S.sec.limits))f.push(L==='en'?'Nothing tagged under "what the authors cannot know"':'Ничего не размечено под «чего авторы не могут знать»');
  NINE.forEach(g=>{const r=S.rows[g.i];
    if(haveSrc()&&(r.standard==='exact'||r.standard==='court')&&r.evidence.trim()&&!inPaper(r.evidence))
      f.push((L==='en'?'Row ':'Строка ')+g.i+(L==='en'?': quote not in the paper':': цитаты нет в статье'));
    if(r.verdict==='supports'&&on.some(x=>r.beats[x.k])&&!(r.both||'').trim())
      f.push((L==='en'?'Row ':'Строка ')+g.i+(L==='en'?': supports, but your rival produces it too':': «поддерживает», но соперник даёт то же'));});
  const noAns=objections().filter(o=>!(S.answers[o.id]||{}).pick);
  if(noAns.length)f.push(noAns.length+(L==='en'?' objection(s) with no answer':' возражений без ответа'));
  return f;
}

/* ---------- diagnostics ---------- */
function diagnostics(){
  const d=[],on=onRivals(),R=S.rows;
  const badQuotes=NINE.filter(g=>{const r=R[g.i];
    return haveSrc()&&(r.standard==='exact'||r.standard==='court')&&r.evidence.trim()&&!inPaper(r.evidence);}).length;
  if(badQuotes)d.push([tx(T.dQuote).replace('{n}',badQuotes),tx(T.dQuoteP)]);
  const conceded=NINE.filter(g=>R[g.i].verdict==='supports'&&on.some(x=>R[g.i].beats[x.k])).length;
  if(conceded&&on.length)d.push([tx(T.dApply)
    .replace('{r}',on.length+' '+(L==='en'?(on.length===1?'rival':'rivals'):(on.length===1?'соперника':'соперников')))
    .replace('{n}',conceded+' '+(L==='en'?(conceded===1?'row':'rows'):(conceded===1?'строку':'строк'))),tx(T.dApplyP)]);
  const filled=NINE.filter(g=>R[g.i].verdict).length;
  const sup=NINE.filter(g=>R[g.i].verdict==='supports').length;
  if(filled>=5&&sup>=filled-1&&sup>=5)d.push([tx(T.dAll).replace('{n}',sup),tx(T.dAllP)]);
  const supRows=NINE.filter(g=>R[g.i].verdict==='supports');
  if(supRows.length&&!supRows.some(g=>S.morgan[g.i].outcome==='beats'))
    d.push([tx(T.dMorgan),tx(T.dMorganP)]);
  if(!norm(S.sec.limits))d.push([tx(T.dLimits),tx(T.dLimitsP)]);
  const ch=(S.vChange||'').toLowerCase();
  if(S.verdict&&(!ch.trim()||/more research|further research|нужны дополнительные|дальнейшие исследования/.test(ch)))
    d.push([tx(T.dTest),tx(T.dTestP)]);
  const thin=Object.values(S.answers).filter(a=>a.pick==='stand'&&(a.text||'').trim().split(/\s+/).filter(Boolean).length<15).length;
  if(thin)d.push([tx(T.dStand).replace('{n}',thin),tx(T.dStandP)]);
  const des=NINE.filter(g=>R[g.i].nothingKind==='design').length;
  if(des)d.push([tx(T.dDesign).replace('{n}',des),tx(T.dDesignP)]);
  return d;
}

  if(S.rivalsLocked){const lb=$('#lockBtn');if(lb)lb.textContent=L==='en'?'Locked - continue':'Зафиксировано - дальше';

  const on=onRivals(),Lx=[],R=S.rows;
  Lx.push(`# From association to causation — ${S.meName||'(no name)'}`,``);
  Lx.push(`**Paper:** ${S.mePaper||'—'}`,`**Submitted:** ${new Date().toISOString().slice(0,10)}`,``);
  Lx.push(`## 0 · What was tagged in the paper`,``);
  SECTIONS.forEach(s=>Lx.push(`**${s.q[0]}**`,``,(S.sec[s.k]?'> '+S.sec[s.k].replace(/\n+/g,' '):'> (nothing tagged)'),``));
  Lx.push(`## 1 · The claim`,``,`**X:** ${S.xWhat||'—'} — measured: ${S.xMeas||'—'}`);
  Lx.push(`**Y:** ${S.yWhat||'—'} — measured: ${S.yMeas||'—'}`);
  Lx.push(`**Claim period:** ${S.claimFrom||'?'}–${S.claimTo||'?'} · **Data on X:** ${S.dataFrom||'?'}–${S.dataTo||'?'}`);
  Lx.push(`**Populations:** ${({same:'the same people',diff:'different groups',places:'places, not people'})[S.samePop]||'—'}`,``);
  Lx.push(`## 2 · The question judged`,``);
  ['A','B','C'].forEach(k=>{if(S['q'+k])Lx.push(`- ${k}. ${S['q'+k]}${S.pick===k?'  ← **judged here**':''}`);});
  if(S.pick==='one')Lx.push(`- Treated as a single question.`);
  Lx.push(``,`## 3 · Order in time`,``,`**${({cross:'Both measured at once — no order visible',xfirst:'X measured before Y',yfirst:'Y measured before X',cant:'Cannot tell from what was loaded'})[S.order]||'—'}**`);
  if(S.orderQuote)Lx.push(``,`> ${S.orderQuote}`);
  if(S.targetAns)Lx.push(``,`*What decided where X went:* ${S.targetAns}`);
  Lx.push(``,`## 4 · Rivals, named before the evidence`,``);
  on.forEach(x=>Lx.push(`- **${x.n[0]}** — ${S.rivals[x.k].text}`));
  const ns=NINE.filter(g=>R[g.i].fromSource).length;
  Lx.push(``,`## 5 · The nine`,``);
  if(ns)Lx.push(`*${ns} quote(s) taken from the original paper, beyond the passages given.*`,``);
  Lx.push(`| # | Guideline | Verdict | Standard | Evidence | Source | Rival produces it |`,`|---|---|---|---|---|---|---|`);
  NINE.forEach(g=>{const r=R[g.i];
    const b=on.filter(x=>r.beats[x.k]).map(x=>x.n[0]).join('; ');
    const nk=r.verdict==='nothing'?({notloaded:' (not in what I loaded)',other:' (exists, but in another paper)',design:' (THE DESIGN CANNOT PRODUCE IT)'})[r.nothingKind]||'':'';
    const sd=(STANDARDS.find(s=>s.v===r.standard)||{n:['—']}).n[0];
    const srcMark=r.fromSource?' **[from the original paper, beyond the pack]**':'';
    Lx.push(`| ${g.i} | ${g.n[0]} | ${r.verdict||'—'}${nk} | ${sd} | ${(r.evidence||'—').replace(/\|/g,'/').replace(/\n/g,' ')}${srcMark} | ${(r.source||'—').replace(/\|/g,'/')} | ${b||'no'} |`);
    if(r.verdict==='supports'&&b&&r.both)Lx.push(`| | ↳ why both stand | ${r.both.replace(/\|/g,'/').replace(/\n/g,' ')} | | | | |`);});
  const sup=NINE.filter(g=>R[g.i].verdict==='supports'),beats=sup.filter(g=>S.morgan[g.i].outcome==='beats');
  Lx.push(``,`## 6 · Morgan pass`,``,`${sup.length} rows marked supports · **${beats.length} beat the rival** · ${sup.length-beats.length} decoration`,``);
  sup.forEach(g=>Lx.push(`- Row ${g.i}: **${S.morgan[g.i].outcome||'—'}** — ${S.morgan[g.i].improvement||'(no improvement named)'}`));
  const O=objections();
  Lx.push(``,`## 7 · Objections and answers`,``);
  if(!O.length)Lx.push(`None fired.`);
  O.forEach(o=>{const a=S.answers[o.id]||{};
    Lx.push(`- **[${(a.pick||'NO ANSWER').toUpperCase()}]** ${o.q.replace(/<[^>]+>/g,'')}`);
    if(a.text)Lx.push(`  - ${a.text}`);});
  Lx.push(``,`## 8 · Verdict`,``,`**${({causal:'Causal',notcausal:'Not causal',undecided:'Cannot be decided yet'})[S.verdict]||'—'}**`,``);
  Lx.push(`*Decided by:* ${S.vBecause||'—'}`,``,`*The test that would decide it:* ${S.vChange||'—'}`,``);
  const d=diagnostics();
  Lx.push(`## 9 · ${T.diagT[0]}`,``);
  if(!d.length)Lx.push(T.diagNone[0]); else d.forEach(x=>Lx.push(`- **${x[0]}** ${x[1]}`));
  Lx.push(``,`---`,`${T.openFlagsAt[0]}: ${openFlags().length?openFlags().join(' · '):'none'}`);
  return Lx.join('\n');
}

function buildCaseBox(){

function loadCase(id){
  const c=CASEDATA.packs[id];if(!c)return;
  S.mePaper=c.citation;$('#mePaper').value=c.citation;
  S.claim=c.claim||'';S.caseProv=c.provenance||'';S.caseFid=c.fidelity||null;S.caseId=id;
  S.caseQuotes={};let all=[];
  SECTIONS.forEach(s=>{const v=(c.sections||{})[s.k];
    if(Array.isArray(v)&&v.length){S.caseQuotes[s.k]=v;
      S.sec[s.k]=v.map(q=>q.t).join('\n\n');all=all.concat(v.map(q=>q.t));}
    else if(typeof v==='string'&&v){S.sec[s.k]=v;all.push(v);}});
  if(all.length){S.paper=all.join('\n\n');S.ranges={};}
  $('#pdfStatus').innerHTML=`<b>${esc(c.title)}</b><br>${esc(c.citation)}<br>
    <a href="${esc(c.url)}" target="_blank" rel="noopener">${L==='en'?'open the paper':'открыть статью'}</a>
    ${c.status&&!/^no retraction/i.test(c.status)?`<br><span style="color:var(--verm)">\u26A0 ${esc(c.status)}</span>`:''}
    <br><span class="sub">${esc(c.theOneThing||'')}</span>`;
  if(S.paper){$('#tagZone').hidden=false;renderPane();renderSlots();hintsFromPaper();}
  save();render();
  $('#tagZone').scrollIntoView({behavior:'smooth',block:'start'});
}
async function refreshCases(){
  /* The packs may sit in cases/ next to this page, or flat beside it.
     Try the tidy layout first, then the flat one. Pack filenames are
     resolved by basename, so a manifest that says "cases/x.json" still
     works when the files are flat. */
  for(const base of ['cases/','']){
    try{
      const r=await fetch(base+'index.json',{cache:'no-store'});if(!r.ok)continue;
      const ix=await r.json();if(!ix.cases||!ix.cases.length)continue;
      const packs={};
      await Promise.all(ix.cases.map(async c=>{
        const fn=String(c.file||(c.id+'.json')).split('/').pop();
        const rr=await fetch(base+fn,{cache:'no-store'});if(rr.ok)packs[c.id]=await rr.json();}));
      if(Object.keys(packs).length){CASEDATA={index:ix,packs};buildCaseBox();return;}
    }catch(e){}
  }
  caseLoadFailed();
}

  const m=$('#caseMsg');

}

    const p=parseFloat($('#medPct').value);
    $('#medOut').innerHTML=isFinite(p)&&p>=0&&p<=100
      ?`<div class="hint"><b>${(100-p).toFixed(1)}%</b> ${L==='en'?'of the association does not run through that pathway. Name what it is doing: a second pathway, a mismeasured link, or no effect at all.':'связи не идёт этим путём. Назовите, что оно делает: второй путь, плохо измеренное звено или отсутствие эффекта.'}</div>`
      :`<div class="flag">${L==='en'?'A percentage between 0 and 100.':'Процент от 0 до 100.'}</div>`;});
  $('#btnDl').addEventListener('click',()=>dl('causation-'+slug()+'.md',md(),'text/markdown;charset=utf-8'));
  [$('#btnSave'),$('#btnSave2')].forEach(b=>b&&b.addEventListener('click',()=>dl('progress-'+slug()+'.json',JSON.stringify(S,null,1),'application/json')));
  $('#fileIn').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;
    const r=new FileReader();r.onload=()=>{try{Object.assign(S,JSON.parse(r.result));save();location.reload();}
      catch(err){alert(L==='en'?'That file is not a saved pass.':'Это не сохранённый проход.');}};r.readAsText(f);});
  $('#btnCopy').addEventListener('click',async()=>{
    const t=md();
    try{await navigator.clipboard.writeText(t);}catch(e){
      const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy');}catch(e2){}ta.remove();}
    if(FORM_URL)window.open(FORM_URL,'_blank','noopener');else alert(tx(T.noForm));});
  $('#setupNote').innerHTML=FORM_URL?'':' <b>Tutor:</b> set FORM_URL at the top of the script to wire the hand-in button to your form.';
}

try{const saved=localStorage.getItem('ebm-trainer-2');if(saved)Object.assign(S,JSON.parse(saved));}catch(e){}
L=S.lang||'en';
bind();applyLang();refreshCases();go(S.step||0);
</script>
